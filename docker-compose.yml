# Default stack: Postgres/PostGIS plus the app, which ingests the feeds and
# serves the web UI on http://localhost:8080.
#
# Optional extras, each layered on top of this file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   docker compose -f docker-compose.yml -f docker-compose.kafka.yml up

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: trimetric
      POSTGRES_DB: trimetric
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trimetric -d trimetric"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro

  api:
    build:
      context: .
    command:
      - "-addr=:8080"
      - "-web-path=./web/dist"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: trimetric
      PGDATABASE: trimetric
      PGPASSWORD: ${POSTGRES_PASSWORD:-example}

      # Your Open Transit Data key, from https://otd.delhi.gov.in/data/realtime/
      OTD_API_KEY: ${OTD_API_KEY:?set OTD_API_KEY in .env - see README}

      # Where to get the static schedule. Downloading it from the portal needs
      # a CSRF POST and can break when the portal changes; if it does, drop the
      # zip in ./data and set GTFS_STATIC_FILE=/data/gtfs.zip in .env instead.
      GTFS_STATIC_URL: ${GTFS_STATIC_URL:-https://otd.delhi.gov.in/data/static/}
      GTFS_STATIC_FILE: ${GTFS_STATIC_FILE:-}
      GTFS_STATIC_CSRF: ${GTFS_STATIC_CSRF:-true}

      GTFS_VEHICLE_POSITIONS_URL: ${GTFS_VEHICLE_POSITIONS_URL:-https://otd.delhi.gov.in/api/realtime/VehiclePositions.pb}
      # OTD publishes no TripUpdates feed; set this if that changes.
      GTFS_TRIP_UPDATES_URL: ${GTFS_TRIP_UPDATES_URL:-}
      GTFS_TIMEZONE: ${GTFS_TIMEZONE:-Asia/Kolkata}

      # Empty keeps the realtime pipeline in-process. See docker-compose.kafka.yml.
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
    ports:
      - "8080:8080"
      - "9876:9876"
    restart: unless-stopped
    volumes:
      # Anything you drop in ./data is readable at /data inside the container.
      - ./data:/data:ro

volumes:
  pgdata: {}
